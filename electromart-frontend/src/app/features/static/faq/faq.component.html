<div class="site-container py-12 max-w-3xl">
  <p class="font-mono text-xs tracking-[0.25em] text-copper uppercase mb-3">Support</p>
  <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink mb-10">Frequently Asked Questions</h1>

  <div class="space-y-3">
    @for (faq of faqs; track faq.question; let i = $index) {
      <div class="card overflow-hidden">
        <button
          type="button"
          (click)="toggle(i)"
          class="w-full flex items-center justify-between px-5 py-4 text-left"
          [attr.aria-expanded]="openIndex() === i"
        >
          <span class="font-medium text-ink text-sm">{{ faq.question }}</span>
          <span class="text-copper text-lg shrink-0 ml-4">{{ openIndex() === i ? '−' : '+' }}</span>
        </button>
        @if (openIndex() === i) {
          <div class="px-5 pb-4 text-sm text-steel leading-relaxed">{{ faq.answer }}</div>
        }
      </div>
    }
  </div>
</div>
