<div class="site-container py-16 max-w-md mx-auto">
  @if (step() === 'email') {
    <div class="text-center mb-8">
      <h1 class="font-display text-2xl font-bold text-ink">Reset your password</h1>
      <p class="text-steel text-sm mt-1">Enter your account email and we'll send you a code</p>
    </div>

    <form [formGroup]="emailForm" (ngSubmit)="requestOtp()" class="card p-6 sm:p-8 space-y-4">
      @if (errorMessage()) {
        <div class="bg-red-50 text-red-700 text-sm rounded px-4 py-3">{{ errorMessage() }}</div>
      }
      <div>
        <label class="label-text" for="email">Email</label>
        <input id="email" type="email" formControlName="email" class="input-field" placeholder="you&#64;example.com" />
      </div>
      <button type="submit" [disabled]="loading()" class="btn-primary w-full">
        {{ loading() ? 'Sending...' : 'Send Reset Code' }}
      </button>
      <p class="text-center text-sm">
        <a routerLink="/auth/login" class="text-copper font-semibold hover:text-copper-dark">← Back to login</a>
      </p>
    </form>
  } @else {
    <div class="text-center mb-8">
      <h1 class="font-display text-2xl font-bold text-ink">Enter new password</h1>
      <p class="text-steel text-sm mt-1">Code sent to <span class="font-medium text-ink">{{ submittedEmail }}</span></p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="card p-6 sm:p-8 space-y-4">
      @if (errorMessage()) {
        <div class="bg-red-50 text-red-700 text-sm rounded px-4 py-3">{{ errorMessage() }}</div>
      }
      <div>
        <label class="label-text" for="otpCode">Verification Code</label>
        <input
          id="otpCode"
          type="text"
          inputmode="numeric"
          maxlength="6"
          formControlName="otpCode"
          class="input-field text-center tracking-[0.5em] font-mono text-lg"
          placeholder="······"
        />
      </div>
      <div>
        <label class="label-text" for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" class="input-field" placeholder="At least 8 characters" />
      </div>
      <button type="submit" [disabled]="loading()" class="btn-primary w-full">
        {{ loading() ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
  }
</div>
