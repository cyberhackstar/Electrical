<div class="min-h-screen flex bg-porcelain">
  <!-- Sidebar -->
  <aside class="w-60 bg-ink text-porcelain shrink-0 hidden md:flex flex-col">
    <div class="p-5 border-b border-white/10">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber"></span>
        <span class="font-display font-bold text-lg text-white">Electro<span class="text-copper">Mart</span></span>
      </div>
      <p class="text-[10px] text-porcelain/50 mt-1 tracking-widest uppercase">Admin Panel</p>
    </div>

    <nav class="flex-1 py-4">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/10 text-white border-copper"
          class="flex items-center gap-3 px-5 py-3 text-sm text-porcelain/70 hover:text-white hover:bg-white/5 border-l-2 border-transparent transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="p-5 border-t border-white/10">
      <p class="text-xs text-porcelain/50 mb-2">{{ authService.currentUser()?.fullName }}</p>
      <button type="button" (click)="goToStore()" class="text-xs text-copper hover:text-copper-light font-medium">
        ← Back to Store
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 min-w-0">
    <router-outlet />
  </div>
</div>
