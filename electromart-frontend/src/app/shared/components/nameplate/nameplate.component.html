<div class="relative bg-gradient-to-b from-ink-lighter to-ink rounded-md p-6 sm:p-8 border border-white/10 shadow-card-hover">
  <!-- Rivets -->
  <span class="absolute top-3 left-3 w-1.5 h-1.5 rounded-full bg-steel/50"></span>
  <span class="absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-steel/50"></span>
  <span class="absolute bottom-3 left-3 w-1.5 h-1.5 rounded-full bg-steel/50"></span>
  <span class="absolute bottom-3 right-3 w-1.5 h-1.5 rounded-full bg-steel/50"></span>

  <div class="text-center border-b border-white/10 pb-4 mb-4">
    <p class="font-mono text-[11px] tracking-[0.3em] text-amber">{{ title }}</p>
    @if (subtitle) {
      <p class="font-mono text-[10px] tracking-widest text-porcelain/50 mt-1">{{ subtitle }}</p>
    }
  </div>

  <dl class="grid grid-cols-2 gap-x-4 gap-y-3 font-mono">
    @for (spec of specs; track spec.label) {
      <div>
        <dt class="text-[10px] tracking-widest text-porcelain/40 uppercase">{{ spec.label }}</dt>
        <dd class="text-sm text-porcelain font-medium mt-0.5">{{ spec.value }}</dd>
      </div>
    }
  </dl>
</div>
