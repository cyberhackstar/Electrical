<a [routerLink]="['/product', product.slug]" class="card group flex flex-col overflow-hidden">
  <div class="relative aspect-square bg-porcelain overflow-hidden">
    <img
      [src]="primaryImage"
      [alt]="product.name"
      loading="lazy"
      class="w-full h-full object-contain p-4 group-hover:scale-105 transition-transform duration-300"
    />

    @if (discountPercent) {
      <span class="absolute top-2 left-2 bg-teal text-white text-[11px] font-bold px-2 py-1 rounded">
        {{ discountPercent }}% OFF
      </span>
    }

    @if (!product.inStock) {
      <span class="absolute top-2 left-2 bg-steel text-white text-[11px] font-bold px-2 py-1 rounded">
        Out of Stock
      </span>
    }

    <button
      type="button"
      (click)="toggleWishlist($event)"
      class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 flex items-center justify-center hover:bg-white transition-colors"
      [attr.aria-label]="isWishlisted ? 'Remove from wishlist' : 'Add to wishlist'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" [attr.fill]="isWishlisted ? '#C9752E' : 'none'" viewBox="0 0 24 24" stroke="#C9752E" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </button>
  </div>

  <div class="p-4 flex flex-col flex-1">
    @if (product.brandName) {
      <p class="text-[11px] text-steel uppercase tracking-wide mb-1">{{ product.brandName }}</p>
    }
    <h3 class="font-medium text-sm text-ink leading-snug line-clamp-2 mb-1.5 group-hover:text-copper transition-colors">
      {{ product.name }}
    </h3>

    @if (product.ratingCount > 0) {
      <app-star-rating [rating]="product.avgRating" [count]="product.ratingCount" class="mb-2" />
    }

    <div class="mt-auto flex items-baseline gap-2 mb-3">
      <span class="font-mono font-bold text-ink">₹{{ product.effectivePrice | number }}</span>
      @if (discountPercent) {
        <span class="font-mono text-xs text-steel line-through">₹{{ product.price | number }}</span>
      }
    </div>

    <button
      type="button"
      (click)="addToCart($event)"
      [disabled]="!product.inStock || addingToCart"
      class="btn-primary w-full !py-2 !text-sm"
    >
      {{ product.inStock ? (addingToCart ? 'Adding...' : 'Add to Cart') : 'Out of Stock' }}
    </button>
  </div>
</a>
